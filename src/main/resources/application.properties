spring.application.name=duel-tower
server.port=9009

spring.config.import=optional:file:.env[.properties]

spring.devtools.restart.enabled=true
spring.devtools.livereload.enabled=true

# mariaDB
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver
spring.datasource.url=${DB_URL:jdbc:mariadb://localhost:3306/duel_tower}
spring.datasource.username=${DB_USERNAME:duelTowerUser}
spring.datasource.password=${DB_PASSWORD:}

# jpa
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# logging
logging.file.name=logs/duel-tower.log
logging.level.com.example=DEBUG

logging.level.org.hibernate=INFO
logging.level.org.hibernate.orm.type=INFO
logging.level.org.hibernate.SQL=DEBUG

# console + file pattern (includes request id from MDC: %X{rid})
logging.pattern.console=%d{HH:mm:ss.SSS} %-5level [%thread] [%X{rid}] [%logger{36}] - %msg%n
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%thread] [%X{rid}] [%logger{36}] - %msg%n

# basic rolling policy
logging.logback.rollingpolicy.max-file-size=10MB
logging.logback.rollingpolicy.max-history=7

# 파일 업로드 허용 크기 (향후 업로드 기능 쓸 거면 유지)
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB


# session lifecycle
# Duration format examples: 30m, 2h, 45s
# - ttl: last-access 기준 만료 시간
# - cleanup-interval: 스케줄러 만료 정리 주기
duel.session.ttl=30m
duel.session.cleanup-interval=5m

# game rules
# 기본값은 기존 동작과 동일
# 덱/카드 제한
# deck-size, max-deck-copies, max-deck-edit-changes
# 전투 제한
# hand-limit, field-limit, combat-start-draw-count
# 턴 시작 드로우 규칙: hand < threshold 이면 below-threshold, 아니면 at-or-above-threshold

duel.game.rules.deck-size=12
duel.game.rules.max-deck-copies=3
duel.game.rules.max-deck-edit-changes=2
duel.game.rules.max-passives=2
duel.game.rules.max-owned-cards=20
duel.game.rules.hand-limit=6
duel.game.rules.field-limit=5
duel.game.rules.combat-start-draw-count=4
duel.game.rules.turn-start-bonus-draw-hand-threshold=4
duel.game.rules.turn-start-draw-below-threshold=2
duel.game.rules.turn-start-draw-at-or-above-threshold=1
duel.game.rules.max-consumable-uses-per-turn=1
duel.game.rules.max-consumable-uses-per-combat=3

# reward / sell price rules
duel.balance.chest.gold-per-chest=150
duel.balance.chest.item-id=I-1
duel.balance.chest.item-count-per-chest=1
duel.balance.judgement.success-gold=200
duel.balance.judgement.success-keys=1
duel.balance.judgement.failure-gold=80
duel.balance.sell-prices.I-1=25
duel.balance.sell-prices.I-2=100
duel.balance.sell-prices.I-3=250
duel.balance.sell-prices.I-4=25
duel.balance.sell-prices.I-5=100
duel.balance.sell-prices.I-6=125
duel.balance.sell-prices.I-7=250
duel.balance.sell-prices.I-8=12
duel.balance.sell-prices.E-1=100
duel.balance.sell-prices.E-2=125
